<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Lojista - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="corpo_login">

    <div class="container_login">
        <div class="card_login">
            <h2>Área do Lojista</h2>
            <p>Faça login para gerenciar o sistema</p>

            <form action="#" method="POST">
                <div class="campo_formulario">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="seu.email@exemplo.com" required>
                </div>

                <div class="campo_formulario">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Sua senha" required>
                </div>

                <button type="submit" class="btn_entrar">Entrar</button>
            </form>

            <a href="index.html" class="voltar_home">← Voltar para o site</a>
        </div>
    </div>

    <script src="login.js"></script>  

</body>
</html>
